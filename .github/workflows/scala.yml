name: Scala CI

on:
  push:
    branches:
      - 'main'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: formatting
        run: sbt scalafmtCheckAll
      - name: compile
        run: sbt -v compile
      - name: compile unit tests
        run: sbt Test/compile
      - name: tests
        run: sbt test
      - name: assembly
        run: sbt assembly
      - name: dependency updates
        run: sbt xdup
