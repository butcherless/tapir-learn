# Keep all of Pekko (core and HTTP) on 1.x. Pekko core 2.0.0 is out, but Pekko HTTP has no 2.0 GA
# yet (only 2.0.0-M milestones) and tapir-pekko-http-server is built against Pekko HTTP 1.x, so a
# core-only 2.0 bump mixes unsupported majors (see closed PR #982). Remove this pin once Pekko
# HTTP 2.0 is GA, and bump Pekko, Pekko HTTP and Tapir together.
updates.pin = [ { groupId = "org.apache.pekko", version = "1." } ]
